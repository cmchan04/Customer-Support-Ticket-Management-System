[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-ml"
version = "0.1.0"
description = "Reproducible customer-support ticket queue and priority prediction."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.17",
    "joblib==1.5.3",
    "matplotlib==3.10.8",
    "nltk==3.9.4",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "xgboost==3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[project.scripts]
ticket-ml = "ticket_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
