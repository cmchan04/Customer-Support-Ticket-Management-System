<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Solve Your Inquiries{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #17212b; background: #edf2f4; }
    body { margin: 0; min-width: 960px; }
    header { background: #17212b; color: white; padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: white; text-decoration: none; margin-left: 18px; }
    main { max-width: 1180px; margin: 36px auto; padding: 0 28px; }
    .panel { background: white; border: 1px solid #d0dce1; padding: 24px; margin-bottom: 20px; }
    .muted { color: #526a78; }
    button, .button { border: 0; background: #e2693f; color: white; padding: 11px 18px; cursor: pointer; text-decoration: none; }
    code { background: #f5f7f8; padding: 2px 5px; }
  </style>
</head>
<body>
  <header>
    <strong>Solve Your Inquiries</strong>
    {% if request.user.is_authenticated %}
      <nav>
        <span>{{ request.user.get_full_name|default:request.user.email }}</span>
        <a href="{% url 'profile' %}">Profile</a>
        <form action="{% url 'logout' %}" method="post" style="display:inline">
          {% csrf_token %}
          <button type="submit" style="margin-left:18px; padding:0; background:transparent; color:white">Log out</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
