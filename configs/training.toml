[training]
dataset_path = "resources/data/aa_dataset-tickets-multi-lang-5-2-50-version.csv"
artifact_dir = "artifacts/models"
report_dir = "resources/model_output"
cache_dir = "artifacts/cache"
random_seed = 29
test_size = 0.20
cv_folds = 5
n_jobs = 4
minimum_accuracy = 0.90

[search]
ngram_ranges = [[1, 2], [1, 3]]
min_dfs = [1]
max_dfs = [1.0]
logistic_c = [1.0, 3.0, 10.0]
svm_c = [1.0, 3.0, 10.0]
nb_alpha = [0.1, 1.0]
decision_tree_max_depth = [10, 20]
decision_tree_min_samples_leaf = [1, 3]
xgboost_max_depth = [6]
xgboost_n_estimators = [100]
type_svm_weights = [1, 2, 3]
type_svm_c = [1.0, 3.0, 10.0]
type_svm_ngram_ranges = [[1, 3]]
type_onehot_weights = [0.25, 0.5, 1.0, 2.0]
type_router_weights = [1, 3]
type_router_c = [10.0, 30.0]
type_router_ngram_ranges = [[1, 3]]
type_router_max_features = 300000
type_router_class_weight_powers = [0.5, 1.0]
type_router_calibrate_queue = true
type_router_calibration_cv_folds = 3
type_router_calibration_passes = 3
type_router_calibration_grid = [-1.5, -1.0, -0.75, -0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 1.0, 1.5]
joint_type_weights = [3]
joint_c = [10.0]
joint_ngram_ranges = [[1, 3], [1, 4]]
joint_max_features = 300000
joint_class_weight_powers = [1.0, 1.25]
joint_score_temperatures = [0.1, 0.25]
