[training]
dataset_path = "resources/data/aa_dataset-tickets-multi-lang-5-2-50-version.csv"
artifact_dir = "artifacts/models"
report_dir = "resources/model_output"
cache_dir = "artifacts/cache"
random_seed = 29
test_size = 0.20
cv_folds = 5
n_jobs = 4
minimum_accuracy = 0.90

[search]
ngram_ranges = [[1, 2], [1, 3]]
min_dfs = [1]
max_dfs = [1.0]
logistic_c = [1.0, 3.0, 10.0]
svm_c = [1.0, 3.0, 10.0]
nb_alpha = [0.1, 1.0]
decision_tree_max_depth = [10, 20]
decision_tree_min_samples_leaf = [1, 3]
xgboost_max_depth = [6]
xgboost_n_estimators = [100]
weighted_svm_subject_weights = [1, 2, 3, 4]
weighted_svm_c = 10.0
weighted_svm_character_weight = 0.5
weighted_svm_character_ngram_range = [3, 5]
weighted_svm_character_min_df = 2
weighted_svm_character_max_features = 50000
